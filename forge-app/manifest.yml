modules:
  jira:issuePanel:
    - key: fleet-issue-panel
      resource: fleet-panel
      resolver:
        function: panel-resolver
      title: Fleet
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      viewportSize: large
  webtrigger:
    - key: fleet-mcp
      function: mcp-handler
      urlFormat: v2
      response:
        type: dynamic
  scheduledTrigger:
    - key: fleet-lease-reaper
      function: reaper-handler
      interval: fiveMinute
  function:
    - key: panel-resolver
      handler: backend/index.handler
    # No timeoutSeconds on the webtrigger function: Forge only honours custom
    # timeouts on consumer and scheduledTrigger functions, and `forge lint`
    # rejects the manifest otherwise. A webtrigger gets the platform default.
    - key: mcp-handler
      handler: backend/index.mcpHandler
    - key: reaper-handler
      handler: backend/index.reaperHandler
      timeoutSeconds: 120
resources:
  - key: fleet-panel
    path: src/static/issue-panel/dist
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/f3d9b563-6c87-4cd5-a0c3-28b071dbc637
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
