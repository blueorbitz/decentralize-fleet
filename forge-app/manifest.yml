modules:
  jira:issuePanel:
    - key: fleet-issue-panel
      resource: fleet-panel
      resolver:
        function: panel-resolver
      title: Fleet
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      viewportSize: large
  jira:projectPage:
    - key: fleet-page
      resource: fleet-page
      resolver:
        function: page-resolver
      title: Fleet
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:projectSettingsPage:
    - key: fleet-settings
      resource: fleet-settings-ui
      resolver:
        function: settings-resolver
      render: native
      title: Fleet settings
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  webtrigger:
    - key: fleet-mcp
      function: mcp-handler
      urlFormat: v2
      response:
        type: dynamic
    - key: fleet-heartbeat
      function: heartbeat-handler
      urlFormat: v2
      response:
        type: dynamic
  scheduledTrigger:
    - key: fleet-lease-reaper
      function: reaper-handler
      interval: fiveMinute
  function:
    - key: panel-resolver
      handler: backend/index.handler
    # No timeoutSeconds on the webtrigger function: Forge only honours custom
    # timeouts on consumer and scheduledTrigger functions, and `forge lint`
    # rejects the manifest otherwise. A webtrigger gets the platform default.
    - key: mcp-handler
      handler: backend/index.mcpHandler
    - key: reaper-handler
      handler: backend/index.reaperHandler
      timeoutSeconds: 120
    - key: settings-resolver
      handler: backend/settings.settingsHandler
    - key: page-resolver
      handler: backend/index.pageHandler
    - key: heartbeat-handler
      handler: backend/index.heartbeatHandler
resources:
  - key: fleet-panel
    path: src/static/issue-panel/dist
  # UI Kit renders from source; there is no build step for the settings page.
  - key: fleet-settings-ui
    path: src/static/settings/index.jsx
  - key: fleet-page
    path: src/static/fleet-page/dist
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/f3d9b563-6c87-4cd5-a0c3-28b071dbc637
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
